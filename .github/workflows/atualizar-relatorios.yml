name: Atualizar relatório do Project

on:
  # Atualiza quando uma Issue é fechada
  issues:
    types: [closed]

  # Atualiza quando novos commits são enviados para main ou develop
  push:
    branches: [main, develop]

  # Permite executar manualmente
  workflow_dispatch:

  # Atualização automática diária às 08:00 UTC
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout com histórico completo de commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Coletar dados de Commits e GitHub Projects (com rastreamento de quem fechou)
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN_WIKI_ACTION }}
        run: |
          mkdir -p wiki

          # 1. Contagem de commits por autor via Git
          git shortlog -sn --no-merges --all > commits_summary.txt

          # 2. Definição da consulta GraphQL do GitHub Projects rastreando o ClosedEvent
          cat > query.graphql <<'EOF'
          query($login: String!, $projectNumber: Int!, $cursor: String) {
            user(login: $login) {
              projectV2(number: $projectNumber) {
                title
                url
                items(first: 100, after: $cursor) {
                  nodes {
                    type
                    content {
                      ... on Issue {
                        number
                        title
                        state
                        url
                        assignees(first: 20) {
                          nodes {
                            login
                            name
                          }
                        }
                        timelineItems(last: 1, itemTypes: CLOSED_EVENT) {
                          nodes {
                            ... on ClosedEvent {
                              actor {
                                ... on User {
                                  login
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                }
              }
            }
          }
          EOF

          echo '{"contributors":{}}' > report.json
          cursor=""

          while true; do
            if [ -z "$cursor" ]; then
              RESPONSE=$(gh api graphql \
                -F login="mateusfgomes6452" \
                -F projectNumber=2 \
                -f query="$(cat query.graphql)")
            else
              RESPONSE=$(gh api graphql \
                -F login="mateusfgomes6452" \
                -F projectNumber=2 \
                -F cursor="$cursor" \
                -f query="$(cat query.graphql)")
            fi

            echo "$RESPONSE" > response.json

            if jq -e '.errors' response.json > /dev/null; then
              echo "Erro ao consultar o GitHub Project:"
              jq '.errors' response.json
              exit 1
            fi

            jq -c '
              .data.user.projectV2.items.nodes[]
              | select(.type == "ISSUE")
              | select(.content != null)
            ' response.json | while read -r item; do

              number=$(echo "$item" | jq -r '.content.number')
              title=$(echo "$item" | jq -r '.content.title')
              state=$(echo "$item" | jq -r '.content.state')
              url=$(echo "$item" | jq -r '.content.url')

              closed_by_login=$(echo "$item" | jq -r '.content.timelineItems.nodes[0].actor.login // empty')
              closed_by_name=$(echo "$item" | jq -r '.content.timelineItems.nodes[0].actor.name // .content.timelineItems.nodes[0].actor.login // empty')

              # Garante entrada para o usuário que fechou
              if [ -n "$closed_by_login" ]; then
                jq \
                  --arg login "$closed_by_login" \
                  --arg name "$closed_by_name" \
                  '
                  .contributors[$login] //=
                  {
                    name: $name,
                    assigned: [],
                    resolved: [],
                    resolved_by_others: [],
                    pending: []
                  }
                  ' report.json > report.tmp && mv report.tmp report.json
              fi

              # Processa cada responsável atribuído
              echo "$item" | jq -c '.content.assignees.nodes[]?' | while read -r assignee; do
                login=$(echo "$assignee" | jq -r '.login')
                name=$(echo "$assignee" | jq -r '.name // .login')

                jq \
                  --arg login "$login" \
                  --arg name "$name" \
                  '
                  .contributors[$login] //=
                  {
                    name: $name,
                    assigned: [],
                    resolved: [],
                    resolved_by_others: [],
                    pending: []
                  }
                  ' report.json > report.tmp && mv report.tmp report.json

                issue=$(jq -n \
                  --arg number "$number" \
                  --arg title "$title" \
                  --arg url "$url" \
                  --arg closed_by "${closed_by_login:-desconhecido}" \
                  '{
                    number: ($number | tonumber),
                    title: $title,
                    url: $url,
                    closed_by: $closed_by
                  }')

                # Adiciona às atribuídas
                jq \
                  --arg login "$login" \
                  --argjson issue "$issue" \
                  '.contributors[$login].assigned += [$issue]' \
                  report.json > report.tmp && mv report.tmp report.json

                if [ "$state" = "CLOSED" ]; then
                  if [ -n "$closed_by_login" ] && [ "$closed_by_login" != "$login" ]; then
                    # Fechado por outra pessoa
                    jq \
                      --arg login "$login" \
                      --argjson issue "$issue" \
                      '.contributors[$login].resolved_by_others += [$issue]' \
                      report.json > report.tmp && mv report.tmp report.json
                  else
                    # Resolvido pelo próprio membro
                    jq \
                      --arg login "$login" \
                      --argjson issue "$issue" \
                      '.contributors[$login].resolved += [$issue]' \
                      report.json > report.tmp && mv report.tmp report.json
                  fi
                else
                  # Issue pendente
                  jq \
                    --arg login "$login" \
                    --argjson issue "$issue" \
                    '.contributors[$login].pending += [$issue]' \
                    report.json > report.tmp && mv report.tmp report.json
                fi
              done

              # Se a Issue foi fechada por alguém que NÃO era assignee, atribui a resolução a essa pessoa
              if [ "$state" = "CLOSED" ] && [ -n "$closed_by_login" ]; then
                is_assignee=$(echo "$item" | jq -r --arg cbl "$closed_by_login" '.content.assignees.nodes[]? | select(.login == $cbl) | .login')
                if [ -z "$is_assignee" ]; then
                  issue=$(jq -n \
                    --arg number "$number" \
                    --arg title "$title" \
                    --arg url "$url" \
                    --arg closed_by "$closed_by_login" \
                    '{
                      number: ($number | tonumber),
                      title: $title,
                      url: $url,
                      closed_by: $closed_by
                    }')
                  jq \
                    --arg login "$closed_by_login" \
                    --argjson issue "$issue" \
                    '.contributors[$login].resolved += [$issue]' \
                    report.json > report.tmp && mv report.tmp report.json
                fi
              fi
            done

            has_next=$(jq -r '.data.user.projectV2.items.pageInfo.hasNextPage' response.json)
            if [ "$has_next" != "true" ]; then break; fi
            cursor=$(jq -r '.data.user.projectV2.items.pageInfo.endCursor' response.json)
          done

      - name: Gerar Ficheiro Markdown
        run: |
          TITLE=$(jq -r '.data.user.projectV2.title // "Projeto"' response.json)
          URL=$(jq -r '.data.user.projectV2.url // "#"' response.json)

          cat > wiki/Relatorio-Projeto.md <<EOF
          # Relatório do Projeto e Contribuições

          **Project:** [$TITLE]($URL)  
          **Última atualização:** $(date -u '+%d/%m/%Y %H:%M UTC')

          ---

          ## Tabela de Commits por Contribuidor

          | Contribuidor | Total de Commits |
          | :--- | :--- |
          EOF

          while read -r line; do
            commits=$(echo "$line" | awk '{print $1}')
            author=$(echo "$line" | cut -f2-)
            echo "| $author | $commits |" >> wiki/Relatorio-Projeto.md
          done < commits_summary.txt

          cat >> wiki/Relatorio-Projeto.md <<EOF

          ---

          ## Detalhamento de Issues por Membro

          EOF

          jq -r '
            .contributors
            | to_entries[]
            | .key as $login
            | .value
            | "### \(.name) (@\($login))\n\n" +
              " - **Issues atribuídas:** \(.assigned | unique_by(.number) | length)\n" +
              " - **Issues resolvidas diretamente:** \(.resolved | unique_by(.number) | length)\n" +
              " - **Issues encerradas por outros membros:** \(.resolved_by_others | unique_by(.number) | length)\n" +
              " - **Issues pendentes:** \(.pending | unique_by(.number) | length)\n\n" +

              if (.resolved | unique_by(.number) | length) > 0 then
                "#### Issues resolvidas diretamente\n\n" +
                (
                  .resolved
                  | unique_by(.number)
                  | sort_by(.number)
                  | map("- [#\(.number) — \(.title)](\(.url))")
                  | join("\n")
                ) + "\n\n"
              else "" end +

              if (.resolved_by_others | unique_by(.number) | length) > 0 then
                "#### Issues encerradas por outros membros\n\n" +
                (
                  .resolved_by_others
                  | unique_by(.number)
                  | sort_by(.number)
                  | map("- [#\(.number) — \(.title)](\(.url)) *(Encerrada por @\(.closed_by))*")
                  | join("\n")
                ) + "\n\n"
              else "" end +

              if (.pending | unique_by(.number) | length) > 0 then
                "#### Issues pendentes\n\n" +
                (
                  .pending
                  | unique_by(.number)
                  | sort_by(.number)
                  | map("- [#\(.number) — \(.title)](\(.url))")
                  | join("\n")
                ) + "\n\n"
              else "" end +
              "---\n"
          ' report.json >> wiki/Relatorio-Projeto.md

      - name: Publicar diretamente na Wiki do GitHub
        env:
          WIKI_TOKEN: ${{ secrets.PROJECTS_TOKEN_WIKI_ACTION }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki_repo
          
          cp wiki/Relatorio-Projeto.md wiki_repo/Relatorio-Projeto.md
          
          cd wiki_repo
          git add Relatorio-Projeto.md
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no relatório."
          else
            git commit -m "docs: atualiza relatorio do projeto com rastreamento preciso de resolucao"
            git push
          fi