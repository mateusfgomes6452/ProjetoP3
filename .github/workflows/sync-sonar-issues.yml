name: Sync Sonar Issues

on:
  workflow_run:
    workflows: ["SonarQube"]
    types:
      - completed
    branches:
      - main

  # Permite executar este workflow manualmente.
  # Útil para distribuir as Issues que já estão no Backlog.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-sonar-issues
  cancel-in-progress: true

jobs:
  sync:
    name: Sonar to GitHub Issues
    runs-on: ubuntu-latest

    # Executa automaticamente quando o SonarQube termina com sucesso
    # ou manualmente através do botão "Run workflow".
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # =========================================================
      # 1. CRIAR/GARANTIR A LABEL SONAR
      # =========================================================
      - name: Criar label sonar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sonar \
            --repo "${{ github.repository }}" \
            --description "Problema identificado automaticamente pelo Sonar" \
            --color "1D76DB" \
            --force

      # =========================================================
      # 2. AGUARDAR A ANÁLISE CORRETA APARECER NO SONAR
      # =========================================================
      - name: Aguardar análise aparecer no Sonar
        if: github.event_name == 'workflow_run'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: mateusfgomes6452_ProjetoP3
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["SONAR_TOKEN"]
          project = os.environ["SONAR_PROJECT_KEY"]
          expected_sha = os.environ["EXPECTED_SHA"].lower()

          def sonar_get(url):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}"}
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          url = (
              "https://sonarcloud.io/api/project_analyses/search?"
              + urllib.parse.urlencode({
                  "project": project,
                  "ps": 1
              })
          )

          for tentativa in range(36):
              data = sonar_get(url)
              analyses = data.get("analyses", [])

              if analyses:
                  revision = analyses[0].get("revision", "").lower()

                  print(f"Última revisão no Sonar: {revision}")
                  print(f"Revisão esperada:        {expected_sha}")

                  if revision == expected_sha:
                      print("Análise correta encontrada no Sonar.")
                      break

              print("Aguardando o Sonar finalizar o processamento...")
              time.sleep(5)

          else:
              raise SystemExit(
                  "A análise deste commit não apareceu "
                  "no Sonar dentro do tempo esperado."
              )
          PY

      # =========================================================
      # 3. SINCRONIZAR SONAR COM GITHUB ISSUES
      # =========================================================
      - name: Sincronizar Issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_PROJECT_KEY: mateusfgomes6452_ProjetoP3
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request

          token = os.environ["SONAR_TOKEN"]
          project = os.environ["SONAR_PROJECT_KEY"]
          repository = os.environ["GH_REPOSITORY"]

          def sonar_get(url):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}"}
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # =====================================================
          # 3.1 BUSCAR ISSUES DO SONAR
          # =====================================================
          sonar_issues = {}
          pagina = 1

          while True:
              parametros = urllib.parse.urlencode({
                  "componentKeys": project,
                  "branch": "main",
                  "p": pagina,
                  "ps": 500
              })

              data = sonar_get(
                  "https://sonarcloud.io/api/issues/search?"
                  + parametros
              )

              for issue in data.get("issues", []):
                  status = (
                      issue.get("issueStatus")
                      or issue.get("status")
                      or ""
                  ).upper()

                  if status in {
                      "OPEN",
                      "ACCEPTED",
                      "CONFIRMED",
                      "REOPENED"
                  }:
                      sonar_issues[issue["key"]] = issue

              paging = data.get("paging", {})
              total = paging.get("total", data.get("total", 0))
              page_size = paging.get("pageSize", data.get("ps", 500))

              if pagina * page_size >= total:
                  break

              pagina += 1

          print(
              f"Issues ativas encontradas no Sonar: "
              f"{len(sonar_issues)}"
          )

          # =====================================================
          # 3.2 BUSCAR ISSUES SONAR JÁ EXISTENTES NO GITHUB
          # =====================================================
          resultado = subprocess.run(
              [
                  "gh",
                  "issue",
                  "list",
                  "--repo",
                  repository,
                  "--state",
                  "all",
                  "--label",
                  "sonar",
                  "--limit",
                  "1000",
                  "--json",
                  "number,state,body,title"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          lista_github = json.loads(resultado.stdout)
          github_issues = {}
          marcador = re.compile(r"<!-- sonar-key:(.*?) -->")

          for issue in lista_github:
              body = issue.get("body") or ""
              match = marcador.search(body)

              if match:
                  github_issues[match.group(1)] = issue

          # =====================================================
          # 3.3 CRIAR OU REABRIR ISSUES
          # =====================================================
          for key, issue in sonar_issues.items():

              if key in github_issues:
                  github_issue = github_issues[key]

                  if github_issue["state"].upper() == "CLOSED":
                      subprocess.run(
                          [
                              "gh",
                              "issue",
                              "reopen",
                              str(github_issue["number"]),
                              "--repo",
                              repository
                          ],
                          check=True
                      )

                      subprocess.run(
                          [
                              "gh",
                              "issue",
                              "comment",
                              str(github_issue["number"]),
                              "--repo",
                              repository,
                              "--body",
                              "O Sonar voltou a identificar este problema."
                          ],
                          check=True
                      )

                  continue

              mensagem = issue.get(
                  "message",
                  "Problema identificado pelo Sonar"
              )

              componente = issue.get("component", "")

              if ":" in componente:
                  arquivo = componente.split(":", 1)[1]
              else:
                  arquivo = componente

              linha = issue.get("line", "Não informada")
              regra = issue.get("rule", "Não informada")

              severidade = (
                  issue.get("severity")
                  or issue.get("impactSeverity")
                  or "Não informada"
              )

              titulo = f"[Sonar] {mensagem}"

              if len(titulo) > 220:
                  titulo = titulo[:217] + "..."

              # O body usa join em vez de string multilinha.
              # Isso evita problemas de indentação do YAML.
              body = "\n".join([
                  "Problema identificado automaticamente pelo Sonar.",
                  "",
                  f"Arquivo: `{arquivo}`",
                  f"Linha: `{linha}`",
                  f"Regra: `{regra}`",
                  f"Severidade: `{severidade}`",
                  "",
                  "Problema:",
                  "",
                  mensagem,
                  "",
                  f"Sonar Issue Key: `{key}`",
                  "",
                  f"<!-- sonar-key:{key} -->"
              ])

              subprocess.run(
                  [
                      "gh",
                      "issue",
                      "create",
                      "--repo",
                      repository,
                      "--title",
                      titulo,
                      "--body",
                      body,
                      "--label",
                      "sonar"
                  ],
                  check=True
              )

              print(f"GitHub Issue criada: {key}")

          # =====================================================
          # 3.4 FECHAR ISSUES CORRIGIDAS
          # =====================================================
          for key, issue in github_issues.items():

              if (
                  key not in sonar_issues
                  and issue["state"].upper() == "OPEN"
              ):
                  subprocess.run(
                      [
                          "gh",
                          "issue",
                          "close",
                          str(issue["number"]),
                          "--repo",
                          repository,
                          "--comment",
                          (
                              "O Sonar não identificou mais este "
                              "problema na análise mais recente."
                          )
                      ],
                      check=True
                  )

                  print(f"Issue #{issue['number']} fechada.")
          PY

      # =========================================================
      # 4. DISTRIBUIR ISSUES ENTRE A EQUIPE
      #
      # REGRAS:
      #
      # - só considera Issues com label sonar;
      # - nunca redistribui uma Issue que já tem responsável;
      # - Issues abertas e fechadas contam no histórico;
      # - concluir uma Issue não reduz a carga histórica;
      # - quem recebeu menos Issues no histórico recebe a próxima;
      # - todos os cinco membros precisam estar aptos a receber.
      # =========================================================
      - name: Distribuir Issues entre a equipe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess

          repository = os.environ["GH_REPOSITORY"]

          # =====================================================
          # EQUIPE FIXA
          # =====================================================
          team = [
              "mateusfgomes6452",
              "FabJMA",
              "diasmarthur",
              "raullteoss",
              "MarceloOBarbosa"
          ]

          # =====================================================
          # 4.1 VERIFICAR SE TODOS PODEM RECEBER ISSUES
          # =====================================================
          print("Verificando integrantes da equipe...")

          ineligible = []

          for user in team:
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{repository}/assignees/{user}"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  print(f"OK: {user}")

              else:
                  print(
                      f"ERRO: {user} ainda não pode "
                      f"receber Issues."
                  )

                  ineligible.append(user)

          # Se qualquer membro ainda não puder receber Issues,
          # interrompe a distribuição para não favorecer apenas
          # quem já está habilitado.
          if ineligible:
              print("\nA distribuição foi interrompida.")

              print(
                  "Os seguintes integrantes ainda não "
                  "podem receber Issues:"
              )

              for user in ineligible:
                  print(f"- {user}")

              raise SystemExit(
                  "Todos os integrantes precisam estar "
                  "aptos a receber Issues antes da distribuição."
              )

          # =====================================================
          # 4.2 BUSCAR TODO O HISTÓRICO DE ISSUES SONAR
          #
          # state=all:
          # inclui Issues abertas e fechadas.
          # =====================================================
          result = subprocess.run(
              [
                  "gh",
                  "issue",
                  "list",
                  "--repo",
                  repository,
                  "--state",
                  "all",
                  "--label",
                  "sonar",
                  "--limit",
                  "1000",
                  "--json",
                  "number,title,state,assignees"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          issues = json.loads(result.stdout)

          print(
              f"\nTotal histórico de Issues Sonar: "
              f"{len(issues)}"
          )

          # =====================================================
          # 4.3 CONTAR QUANTAS ISSUES CADA PESSOA JÁ RECEBEU
          # =====================================================
          workload = {
              user: 0
              for user in team
          }

          # Permite comparar os usernames sem diferença
          # entre letras maiúsculas e minúsculas.
          team_lookup = {
              user.lower(): user
              for user in team
          }

          unassigned_open_issues = []

          for issue in issues:
              assignees = issue.get("assignees", [])

              # -------------------------------------------------
              # CONTAGEM HISTÓRICA
              #
              # Uma Issue continua contando mesmo se estiver
              # fechada/Done.
              # -------------------------------------------------
              for assignee in assignees:
                  login = (
                      assignee
                      .get("login", "")
                      .lower()
                  )

                  if login in team_lookup:
                      user = team_lookup[login]
                      workload[user] += 1

              # -------------------------------------------------
              # SÓ DISTRIBUI SE:
              #
              # - a Issue estiver aberta;
              # - a Issue não tiver nenhum assignee.
              #
              # Se já houver responsável, nunca redistribui.
              # -------------------------------------------------
              if (
                  issue["state"].upper() == "OPEN"
                  and len(assignees) == 0
              ):
                  unassigned_open_issues.append(issue)

          # =====================================================
          # 4.4 MOSTRAR A DISTRIBUIÇÃO ATUAL
          # =====================================================
          print("\nDistribuição histórica atual:")

          for user in team:
              print(
                  f"{user}: "
                  f"{workload[user]} "
                  f"Issues recebidas"
              )

          print(
              f"\nIssues abertas sem responsável: "
              f"{len(unassigned_open_issues)}"
          )

          # =====================================================
          # 4.5 ORDENAR ISSUES
          #
          # A ordenação pelo número deixa o comportamento
          # previsível.
          # =====================================================
          unassigned_open_issues.sort(
              key=lambda issue: issue["number"]
          )

          # =====================================================
          # 4.6 DISTRIBUIR
          # =====================================================
          for issue in unassigned_open_issues:

              # Escolhe quem recebeu menos Issues historicamente.
              #
              # Em caso de empate, segue a ordem definida
              # na lista team.
              chosen = min(
                  team,
                  key=lambda user: (
                      workload[user],
                      team.index(user)
                  )
              )

              issue_number = issue["number"]

              print(
                  f"\nAtribuindo Issue "
                  f"#{issue_number} para {chosen}..."
              )

              subprocess.run(
                  [
                      "gh",
                      "issue",
                      "edit",
                      str(issue_number),
                      "--repo",
                      repository,
                      "--add-assignee",
                      chosen
                  ],
                  check=True
              )

              # Aumenta imediatamente a carga histórica.
              # Assim, a próxima Issue tende a ir para outro
              # integrante.
              workload[chosen] += 1

              print(
                  f"Issue #{issue_number} "
                  f"atribuída a {chosen}."
              )

          # =====================================================
          # 4.7 RESULTADO FINAL
          # =====================================================
          print("\nDistribuição histórica final:")

          for user in team:
              print(
                  f"{user}: "
                  f"{workload[user]} "
                  f"Issues recebidas"
              )
          PY